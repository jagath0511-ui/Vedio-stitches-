name: Agent notification recovery

on:
  workflow_run:
    workflows: ["Unattended agent runner"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  notify:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install notification client
        run: python -m pip install -e .
      - name: Recover durable notification outbox
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p agent-artifacts
          gh run download "$RUN_ID" --name "agent-artifacts-$RUN_ID" --dir agent-artifacts || true
      - name: Retry email and SMS delivery
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: jagath1105@gmail.com
          GITHUB_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SMS_ACCOUNT_SID: ${{ secrets.SMS_ACCOUNT_SID }}
          SMS_AUTH_TOKEN: ${{ secrets.SMS_AUTH_TOKEN }}
          SMS_FROM: ${{ secrets.SMS_FROM }}
          SMS_RECIPIENT: "+91 7671031414"
        run: |
          if [ ! -f agent-artifacts/notification-outbox.json ]; then
            echo "No durable notification outbox was uploaded; nothing to retry."
            exit 0
          fi
          python -m agent.notify_cli --retry-only \
            --outbox agent-artifacts/notification-outbox.json
